x-security-hardened: &security-hardened
  cap_drop: [ALL]
  cap_add: [DAC_OVERRIDE]
  security_opt: [no-new-privileges:true]

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-client-deploy: &client-deploy
  resources:
    limits:
      cpus: '1.0'
      memory: 512M
      pids: 100
    reservations:
      memory: 256M

services:
  enum:
    build: https://github.com/owasp-amass/amass.git#main
    <<: *security-hardened
    logging: *default-logging
    networks:
      - amass
    env_file:
      - ./config/logs/syslog.env
    volumes:
      - ./config:/.config/amass:rw
      - ./data/enum:/data:rw
    deploy:
      <<: *client-deploy
    depends_on:
      engine:
        condition: service_healthy
      syslog:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully
    entrypoint: /bin/enum

  viz:
    build: https://github.com/owasp-amass/amass.git#main
    <<: *security-hardened
    logging: *default-logging
    networks:
      - amass
    env_file:
      - ./config/logs/syslog.env
    volumes:
      - ./config:/.config/amass:rw
      - ./data/viz:/data:rw
    deploy:
      <<: *client-deploy
    depends_on:
      assetdb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      syslog:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully
    entrypoint: /bin/viz

  subs:
    build: https://github.com/owasp-amass/amass.git#main
    <<: *security-hardened
    logging: *default-logging
    networks:
      - amass
    env_file:
      - ./config/logs/syslog.env
    volumes:
      - ./config:/.config/amass:rw
      - ./data/subs:/data:rw
    deploy:
      <<: *client-deploy
    depends_on:
      assetdb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      syslog:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully
    entrypoint: /bin/subs

  assoc:
    build: https://github.com/owasp-amass/amass.git#main
    <<: *security-hardened
    logging: *default-logging
    networks:
      - amass
    env_file:
      - ./config/logs/syslog.env
    volumes:
      - ./config:/.config/amass:rw
      - ./data/assoc:/data:rw
    deploy:
      <<: *client-deploy
    depends_on:
      assetdb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      syslog:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully
    entrypoint: /bin/assoc

  track:
    build: https://github.com/owasp-amass/amass.git#main
    <<: *security-hardened
    logging: *default-logging
    networks:
      - amass
    env_file:
      - ./config/logs/syslog.env
    volumes:
      - ./config:/.config/amass:rw
      - ./data/track:/data:rw
    deploy:
      <<: *client-deploy
    depends_on:
      assetdb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      syslog:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully
    entrypoint: /bin/track

  mcp:
    build: ./mcp
    container_name: mcp
    profiles: ["mcp"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      - amass
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${PROJECT_DIR}:${PROJECT_DIR}:ro
    environment:
      - HOST_PROJECT_DIR=${PROJECT_DIR}
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 100
        reservations:
          memory: 128M
    depends_on:
      engine:
        condition: service_healthy
      syslog:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8080)); s.close()"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  arti:
    build: ./arti
    container_name: arti
    profiles: ["tor"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks:
      - amass
    expose:
      - "9150"
      - "8118"
    environment:
      - SOCKS_PORT=9150
      - HTTP_PORT=8118
      - DEBUG=${DEBUG:-}
    read_only: true
    tmpfs:
      - /tmp:size=10m,mode=1777
    volumes:
      - arti-cache:/var/cache/arti
      - arti-state:/var/lib/arti
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 320M
          pids: 150
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      start_period: 3m
      start_interval: 30s
      interval: 5m
      timeout: 20s
      retries: 3
    restart: unless-stopped

  config-init:
    image: alpine:3.21
    <<: *security-hardened
    logging: *default-logging
    network_mode: none
    secrets:
      - user_env_file
    volumes:
      - ./config:/.config/amass:rw
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
          pids: 50
    entrypoint: ["/bin/sh", "/.config/amass/config-init.sh"]

  engine:
    build: https://github.com/owasp-amass/amass.git#main
    container_name: engine
    <<: *security-hardened
    logging: *default-logging
    working_dir: /.config/amass
    networks:
      - amass
    environment:
      - POSTAL_SERVER_HOST=postal
      - POSTAL_SERVER_PORT=8000
    env_file:
      - ./config/logs/syslog.env
      - path: ./config/proxy.env
        required: false
    volumes:
      - ./data/engine:/.config/amass:rw
    expose:
      - "4000"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 5
        window: 360s
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
          pids: 200
        reservations:
          memory: 1024M
    depends_on:
      assetdb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postal:
        condition: service_healthy
      syslog:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "ae_isready", "--host", "127.0.0.1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: /bin/engine

  assetdb:
    build: https://github.com/owasp-amass/asset-db.git#main
    shm_size: '256m'
    container_name: assetdb
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: *default-logging
    networks:
      - amass
    volumes:
      - ./assetdb/postgres:/var/lib/postgresql:rw
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - AMASS_DB=${AMASS_DB}
      - AMASS_USER=${AMASS_USER}
      - AMASS_PASSWORD=${AMASS_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
          pids: 200
        reservations:
          memory: 512M
    entrypoint:
      - sh
      - -euc
      - |
        /usr/local/bin/docker-entrypoint.sh postgres

  neo4j:
    image: neo4j:2026.01.4
    container_name: neo4j
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: *default-logging
    networks:
      - amass
    volumes:
      - ./assetdb/neo4j:/data:rw
    environment:
      - NEO4J_AUTH=neo4j/${AMASS_PASSWORD}
      - NEO4J_initial_dbms_default__database=${AMASS_DB}
      - NEO4J_server_memory_heap_max__size=4G
      - AMASS_PASSWORD=${AMASS_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '2.0'
          memory: 6144M
          pids: 200
        reservations:
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${AMASS_PASSWORD}\" 'RETURN 1' || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  postal:
    image: ghcr.io/le0pard/postal_server:v0.3.1
    container_name: postal
    <<: *security-hardened
    logging: *default-logging
    networks:
      - amass
    env_file:
      - ./config/logs/syslog.env
    expose:
      - "8000"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 5
        window: 360s
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
          pids: 200
        reservations:
          memory: 2048M
    depends_on:
      syslog:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://postal:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  syslog:
    image: lscr.io/linuxserver/syslog-ng:4.8.1
    container_name: syslog
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: *default-logging
    networks:
      - amass
    environment:
      - TZ=Etc/UTC
    volumes:
      - ./config/logs:/config:rw
      - ./logs:/var/log:rw
    expose:
      - "5514/udp"
      - "6601/tcp"
      - "6514/tcp"
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 100
    healthcheck:
      test: ["CMD-SHELL", "syslog-ng-ctl healthcheck --timeout 5 -c /config/syslog-ng.ctl || exit 1"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  arti-cache:
  arti-state:

networks:
  amass:
    driver: bridge
    name: amass-net

secrets:
  user_env_file:
    file: ./.env
